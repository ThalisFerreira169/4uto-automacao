name: Selenium Java Tests

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./selenium

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Executar testes de Regressão
      run: mvn clean test

    - name: Upload de Relatórios de Falha
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: relatorios-selenium-junit
        path: selenium/target/surefire-reports/